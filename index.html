<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GameArena · Panel del administrador</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body>

  <header class="ga-header">
    <div class="container">
      <h1 class="ga-brand">GameArena · Panel del administrador</h1>
      <span id="conexion" class="ga-conexion">Sin conectar</span>
    </div>
  </header>

  <main class="container ga-main">

    <!-- zona de avisos: aquí aparecerán los mensajes (verde, amarillo o rojo) -->
    <div id="aviso" class="ga-aviso" role="status" aria-live="polite"></div>

    <ul class="nav nav-tabs ga-tabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="tabTorneos" data-bs-toggle="tab" data-bs-target="#paneTorneos" type="button" role="tab" aria-controls="paneTorneos" aria-selected="true">Torneos</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="tabJugadores" data-bs-toggle="tab" data-bs-target="#paneJugadores" type="button" role="tab" aria-controls="paneJugadores" aria-selected="false">Jugadores</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="tabVideojuegos" data-bs-toggle="tab" data-bs-target="#paneVideojuegos" type="button" role="tab" aria-controls="paneVideojuegos" aria-selected="false">Videojuegos</button>
      </li>
    </ul>

    <div class="tab-content">

      <!-- ===================== TORNEOS ===================== -->
      <div class="tab-pane fade show active" id="paneTorneos" role="tabpanel" aria-labelledby="tabTorneos" tabindex="0">

        <section class="card ga-card">
          <h2 class="card-header">Torneos</h2>
          <div class="card-body">

            <div class="ga-tools">
              <div class="ga-filter">
                <div>
                  <label class="form-label" for="filtroEstado">Estado</label>
                  <select class="form-select" id="filtroEstado">
                    <option value="">Todos</option>
                    <option value="ABIERTO">ABIERTO</option>
                    <option value="EN_CURSO">EN_CURSO</option>
                    <option value="FINALIZADO">FINALIZADO</option>
                  </select>
                </div>
                <div>
                  <label class="form-label" for="filtroVideojuego">Videojuego</label>
                  <select class="form-select" id="filtroVideojuego">
                    <option value="">Todos</option>
                    <!-- sus opciones las rellena la misma carga de videojuegos del formulario -->
                  </select>
                </div>
                <button type="button" class="btn btn-ga" id="btnFiltrarTorneos">Filtrar</button>
                <!-- GET /torneos?estado={estado}&videojuegoId={id}: aquí se pintarán los torneos filtrados por estado, videojuego o ambos -->
              </div>
              <div class="ga-search">
                <label class="form-label" for="buscarTorneoId">Buscar por ID</label>
                <div class="input-group">
                  <input type="number" min="1" class="form-control" id="buscarTorneoId">
                  <button type="button" class="btn btn-line" id="btnBuscarTorneo">Buscar</button>
                </div>
                <!-- GET /torneos/{id}: aquí se buscará un torneo por ID -->
              </div>
            </div>

            <div id="resTorneo" class="ga-res"><!-- resultado de la búsqueda --></div>

            <div class="table-responsive ga-tablewrap">
              <table class="table ga-table">
                <thead>
                  <tr><th>ID</th><th>Nombre</th><th>Videojuego</th><th>Estado</th><th>Acciones</th></tr>
                </thead>
                <tbody id="cuerpoTorneos">
                  <!-- GET /torneos: aquí se pintarán los torneos -->
                  <!-- cada fila lleva 3 botones (a la derecha): Participantes, Editar y Eliminar -->
                  <!-- DELETE /torneos/{id}: botón Eliminar de cada fila -->
                </tbody>
              </table>
            </div>

          </div>
        </section>

        <div class="row g-4 mt-0">
          <div class="col-lg-6">
            <section class="card ga-card h-100">
              <h2 class="card-header">Torneo</h2>
              <form id="formTorneo" class="card-body vstack gap-3">
                <div>
                  <label class="form-label" for="tNombre">Nombre</label>
                  <input type="text" class="form-control" id="tNombre" required>
                </div>
                <div>
                  <label class="form-label" for="tVideojuego">Videojuego</label>
                  <select class="form-select" id="tVideojuego" required>
                    <option value="" selected></option>
                    <!-- GET /videojuegos: aquí se rellenará el selector con los videojuegos -->
                  </select>
                </div>
                <div>
                  <label class="form-label" for="tEstado">Estado</label>
                  <select class="form-select" id="tEstado" required>
                    <option value="ABIERTO">ABIERTO</option>
                    <option value="EN_CURSO">EN_CURSO</option>
                    <option value="FINALIZADO">FINALIZADO</option>
                  </select>
                </div>
                <!-- POST /torneos: aquí se creará el torneo al pulsar el botón -->
                <!-- PUT /torneos/{id}: aquí se modificará el torneo al pulsar el botón (modo edición) -->
                <button type="submit" class="btn btn-ok" id="btnTorneo">Crear torneo</button>
              </form>
            </section>
          </div>

          <div class="col-lg-6">
            <section class="card ga-card ga-sub h-100" id="panelParticipantesTorneo" hidden>
              <h2 class="card-header" id="tituloParticipantesTorneo">Participantes del torneo</h2>
              <div class="card-body vstack gap-3">
                <ul class="ga-lista" id="listaParticipantesTorneo">
                  <!-- GET /torneos/{id}/participaciones: aquí se pintarán los participantes del torneo -->
                  <!-- una línea por jugador -->
                </ul>
                <form id="formInscripcion" class="vstack gap-3">
                  <div>
                    <label class="form-label" for="iJugador">Jugador a inscribir</label>
                    <select class="form-select" id="iJugador" required>
                      <option value="" selected></option>
                      <!-- GET /jugadores: aquí se rellenará el selector con los jugadores -->
                    </select>
                  </div>
                  <!-- POST /torneos/{id}/participaciones: aquí se inscribirá al jugador elegido en este torneo -->
                  <button type="submit" class="btn btn-ga" id="btnInscribir">Inscribir jugador</button>
                </form>
              </div>
            </section>
          </div>
        </div>

      </div>

      <!-- ===================== JUGADORES ===================== -->
      <div class="tab-pane fade" id="paneJugadores" role="tabpanel" aria-labelledby="tabJugadores" tabindex="0">

        <section class="card ga-card">
          <h2 class="card-header">Jugadores</h2>
          <div class="card-body">

            <div class="ga-tools">
              <div class="ga-search">
                <label class="form-label" for="buscarJugadorId">Buscar por ID</label>
                <div class="input-group">
                  <input type="number" min="1" class="form-control" id="buscarJugadorId">
                  <button type="button" class="btn btn-line" id="btnBuscarJugador">Buscar</button>
                </div>
                <!-- GET /jugadores/{id}: aquí se buscará un jugador por ID -->
              </div>
            </div>

            <div id="resJugador" class="ga-res"><!-- resultado de la búsqueda --></div>

            <div class="table-responsive ga-tablewrap">
              <table class="table ga-table">
                <thead>
                  <tr><th>ID</th><th>Nick</th><th>Email</th><th>Nivel</th><th>Acciones</th></tr>
                </thead>
                <tbody id="cuerpoJugadores">
                  <!-- GET /jugadores: aquí se pintarán los jugadores -->
                  <!-- cada fila lleva 3 botones (a la derecha): Torneos, Editar y Eliminar -->
                  <!-- DELETE /jugadores/{id}: botón Eliminar de cada fila -->
                </tbody>
              </table>
            </div>

          </div>
        </section>

        <div class="row g-4 mt-0">
          <div class="col-lg-6">
            <section class="card ga-card h-100">
              <h2 class="card-header">Jugador</h2>
              <form id="formJugador" class="card-body vstack gap-3">
                <div>
                  <label class="form-label" for="jNick">Nick</label>
                  <input type="text" class="form-control" id="jNick" required>
                </div>
                <div>
                  <label class="form-label" for="jEmail">Email</label>
                  <input type="email" class="form-control" id="jEmail" required>
                </div>
                <div>
                  <label class="form-label" for="jNivel">Nivel</label>
                  <input type="number" min="0" class="form-control" id="jNivel" required>
                </div>
                <!-- POST /jugadores: aquí se creará el jugador al pulsar el botón -->
                <!-- PUT /jugadores/{id}: aquí se modificará el jugador al pulsar el botón (modo edición) -->
                <button type="submit" class="btn btn-ok" id="btnJugador">Crear jugador</button>
              </form>
            </section>
          </div>

          <div class="col-lg-6">
            <section class="card ga-card ga-sub h-100" id="panelTorneosJugador" hidden>
              <h2 class="card-header" id="tituloTorneosJugador">Torneos del jugador</h2>
              <div class="card-body">
                <ul class="ga-lista" id="listaTorneosJugador">
                  <!-- GET /jugadores/{id}/participaciones: aquí se pintarán los torneos del jugador -->
                  <!-- una línea por torneo -->
                </ul>
              </div>
            </section>
          </div>
        </div>

      </div>

      <!-- ===================== VIDEOJUEGOS ===================== -->
      <div class="tab-pane fade" id="paneVideojuegos" role="tabpanel" aria-labelledby="tabVideojuegos" tabindex="0">

        <section class="card ga-card">
          <h2 class="card-header">Videojuegos</h2>
          <div class="card-body">

            <div class="ga-tools">
              <div class="ga-search">
                <label class="form-label" for="buscarJuegoId">Buscar por ID</label>
                <div class="input-group">
                  <input type="number" min="1" class="form-control" id="buscarJuegoId">
                  <button type="button" class="btn btn-line" id="btnBuscarJuego">Buscar</button>
                </div>
                <!-- GET /videojuegos/{id}: aquí se buscará un videojuego por ID -->
              </div>
            </div>

            <div id="resJuego" class="ga-res"><!-- resultado de la búsqueda --></div>

            <div class="table-responsive ga-tablewrap">
              <table class="table ga-table">
                <thead>
                  <tr><th>ID</th><th>Nombre</th><th>Género</th></tr>
                </thead>
                <tbody id="cuerpoVideojuegos">
                  <!-- GET /videojuegos: aquí se pintarán los videojuegos -->
                </tbody>
              </table>
            </div>

          </div>
        </section>

        <div class="row g-4 mt-0">
          <div class="col-lg-6">
            <section class="card ga-card h-100">
              <h2 class="card-header">Videojuego</h2>
              <form id="formJuego" class="card-body vstack gap-3">
                <div>
                  <label class="form-label" for="vNombre">Nombre</label>
                  <input type="text" class="form-control" id="vNombre" required>
                </div>
                <div>
                  <label class="form-label" for="vGenero">Género</label>
                  <input type="text" class="form-control" id="vGenero" required>
                </div>
                <!-- POST /videojuegos: aquí se creará el videojuego al pulsar el botón -->
                <button type="submit" class="btn btn-ok" id="btnJuego">Crear videojuego</button>
              </form>
            </section>
          </div>
        </div>

      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
